# BlueSpotter DVC pipeline
#
# The data itself never enters this repo — the images live in Google Drive and
# always will. What DVC tracks here is the *description* of the dataset: which
# files are in which split, and what those files contained at the moment of the
# run. Those descriptions are small, so git holds them comfortably, and they are
# enough to make a training run reproducible and auditable.
#
# Reproduce everything:      dvc repro
# Just the data checks:      dvc repro validate index-train index-test
# See what changed:          dvc status  /  dvc metrics diff  /  dvc params diff
#
# `always_changed: true` on the Drive-facing stages is deliberate: Drive can
# change at any moment without anything in git changing, so those stages must
# re-check on every run. Downstream stages still only re-run when the resulting
# index actually differs.

stages:

  # 1. Pull the manifests you author on Drive into the repo, where DVC hashes them.
  sync-manifests:
    cmd: PYTHONPATH=src python -m bluespotter.manifest_sync
    deps:
      - src/bluespotter/manifest_sync.py
    params:
      - dvc.manifest_dir
      - drive.root
    outs:
      - data/manifests/train.csv
      - data/manifests/test.csv
      - reports/manifest_source.json:
          cache: false
    always_changed: true
    desc: Snapshot train.csv / test.csv from the Drive mount into data/manifests/.

  # 2. Structural checks: schema, duplicates, split overlap, group leakage.
  validate:
    cmd: PYTHONPATH=src python -m bluespotter.validate
    deps:
      - data/manifests/train.csv
      - data/manifests/test.csv
      - src/bluespotter/validate.py
    params:
      - dvc.fail_on_group_leak
    metrics:
      # Scalars only — `dvc metrics show` flattens nested JSON, so the per-mouse
      # breakdown lives in validation_detail.json (an output, not a metric).
      - reports/validation.json:
          cache: false
    outs:
      - reports/validation_detail.json:
          cache: false
    desc: Validate manifest schema and check for train/test contamination.

  # 3+4. Content-index every Drive file the manifests point at. This is what turns
  #      "a list of links" into a versioned dataset: the index carries per-file
  #      size/mtime/hash, so its own hash in dvc.lock pins the exact bytes used.
  index-train:
    cmd: PYTHONPATH=src python -m bluespotter.drive_index --split train
    deps:
      - data/manifests/train.csv
      - src/bluespotter/drive_index.py
      - src/bluespotter/manifest.py
    params:
      - dvc.hash_mode
      - dvc.fail_on_missing
      - data.nmslices_root
    outs:
      - data/index/train_index.csv
    metrics:
      - reports/train_index_summary.json:
          cache: false
    always_changed: true
    desc: Hash the Drive files referenced by the train split.

  index-test:
    cmd: PYTHONPATH=src python -m bluespotter.drive_index --split test
    deps:
      - data/manifests/test.csv
      - src/bluespotter/drive_index.py
      - src/bluespotter/manifest.py
    params:
      - dvc.hash_mode
      - dvc.fail_on_missing
      - data.nmslices_root
    outs:
      - data/index/test_index.csv
    metrics:
      - reports/test_index_summary.json:
          cache: false
    always_changed: true
    desc: Hash the Drive files referenced by the test split.

  # 5. Fine-tune Cellpose-SAM. Needs a GPU — run this one in Colab, not in CI.
  #    Depends on the *indexes*, so a changed image on Drive correctly invalidates
  #    the trained model even though no manifest row moved.
  train:
    cmd: PYTHONPATH=src python -m bluespotter.train
    deps:
      - data/index/train_index.csv
      - data/index/test_index.csv
      - data/manifests/train.csv
      - data/manifests/test.csv
      - src/bluespotter/train.py
      - src/bluespotter/manifest.py
      - src/bluespotter/mlflow_utils.py
    params:
      - model
      - train
      - mlflow.experiment_name
    metrics:
      - reports/train_metrics.json:
          cache: false
    plots:
      - reports/loss_curve.csv:
          cache: false
    desc: Fine-tune Cellpose-SAM; logs to MLflow and writes metrics for DVC.

# Plot definitions live at the top level because a single plot draws two columns
# (train vs test loss) from one CSV, which the inline stage form cannot express.
# View with:  dvc plots show    /  compare revisions with:  dvc plots diff
plots:
  - loss:
      template: linear
      x: epoch
      y:
        reports/loss_curve.csv:
          - train_loss
          - test_loss
      title: Cellpose-SAM fine-tuning loss
