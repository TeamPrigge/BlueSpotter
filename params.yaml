# BlueSpotter configuration
# Everything the pipeline needs lives here so runs are reproducible and
# comparable. Edit paths/hyperparameters here rather than in code.

drive:
  # Root of the BlueSpotter folder as seen inside Colab after mounting Drive.
  # If BlueSpotter sits in your personal My Drive:
  #   /content/drive/MyDrive/SoftwareTools/BlueSpotter
  # If it lives in a Shared drive named TeamPrigge:
  #   /content/drive/Shareddrives/TeamPrigge/SoftwareTools/BlueSpotter
  root: /content/drive/MyDrive/TeamPrigge/SoftwareTools/BlueSpotter
  data_subdir: data      # -> {root}/data   (paired _img/_masks files)
  model_subdir: model    # -> {root}/model  (trained weights written here)
  mlruns_subdir: mlruns  # -> {root}/mlruns (MLflow logs, survives Colab)

data:
  # Local scratch dir on the Colab VM. Data is copied here from Drive before
  # training so the loop reads fast local SSD, not the slow Drive mount.
  local_cache: /content/bluespotter_cache
  # --- Manifest mode (links, no storage duplication) ---
  use_manifest: true                       # train from train.csv/test.csv (Drive IDs)
  train_manifest: data/training_data/train.csv
  test_manifest: data/test_data/test.csv
  nmslices_root: /content/drive/MyDrive/TeamPrigge/Data/NM_Slices   # mounted source images
  image_filter: _img     # substring identifying image files
  mask_filter: _masks    # substring identifying mask files
  test_split: 0.15       # fraction held out for validation (if no test dir)

dvc:
  # --- Where the versioned copies live inside the repo (tracked by DVC) ---
  manifest_dir: data/manifests   # snapshots of train.csv / test.csv from Drive
  index_dir: data/index          # per-file size/mtime/hash index of Drive content
  report_dir: reports            # validation + metrics JSON

  # How hard to work to detect that a Drive file changed underneath us:
  #   full        md5 the whole file            (exact; slowest over a Drive mount)
  #   partial     md5 first+last 4 MiB + size   (fast; catches re-exports)
  #   size_mtime  no content read               (fastest; catches almost nothing)
  # Hashes are cached by (path, size, mtime) so only changed files are re-read.
  hash_mode: partial

  # Fail the pipeline if a manifest row points at a file that is not on Drive.
  fail_on_missing: true

  # Fail if the same mouse/slice appears in both train and test. Currently a
  # warning only, because the existing split does overlap - see reports/validation.json.
  # Flip to true once the split is grouped by animal.
  fail_on_group_leak: false

model:
  # Fine-tune from the pretrained Cellpose-SAM weights.
  pretrained: cpsam
  name: bluespotter_lc   # base name for the saved model

train:
  # Cellpose-SAM fine-tuning defaults (per Cellpose docs).
  n_epochs: 100
  learning_rate: 0.00001
  weight_decay: 0.1
  batch_size: 1
  nchan: 3
  min_train_masks: 1        # keep crops with >=1 labelled neuron (Cellpose default is 5)

mlflow:
  experiment_name: bluespotter-lc-segmentation
  # Leave tracking_uri empty to log into the Drive-synced mlruns folder above.
  # To use a hosted server later, set the MLFLOW_TRACKING_URI env var instead —
  # it takes precedence over this file. No code change needed.
  tracking_uri: ""
